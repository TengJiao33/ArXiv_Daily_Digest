name: Research Radar 每日定向采集

on:
  schedule:
    # 每天北京时间 11:00 (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  daily-collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行 Research Radar
        env:
          DOUBAO_API_KEY: ${{ secrets.DOUBAO_API_KEY }}
          DOUBAO_ENDPOINT_ID: ${{ secrets.DOUBAO_ENDPOINT_ID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: 提交采集数据
        run: |
          git config user.name "Research Radar Bot"
          git config user.email "bot@research-radar.local"
          git add data/ || true
          git diff --cached --quiet || git commit -m "📡 $(date +%Y-%m-%d) Research Radar 每日采集"
          git push || true
