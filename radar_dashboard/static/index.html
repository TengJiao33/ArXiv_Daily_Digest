<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Editing Direction Radar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Knowledge Editing Radar</h1>
      <p id="subtitle">Loading editing / unlearning / reliability signals...</p>
    </div>
    <div class="toolbar">
      <select id="weekSelect" aria-label="week"></select>
      <select id="directionSelect" aria-label="direction"></select>
      <button id="refreshBtn" type="button" title="Refresh">↻</button>
    </div>
  </header>

  <main>
    <section class="overview">
      <article class="metric">
        <span>本周论文</span>
        <strong id="totalPapers">0</strong>
      </article>
      <article class="metric">
        <span>带代码</span>
        <strong id="totalCode">0</strong>
      </article>
      <article class="metric">
        <span>追踪方向</span>
        <strong id="directionCount">0</strong>
      </article>
      <article class="metric">
        <span>当前周</span>
        <strong id="currentWeek">-</strong>
      </article>
    </section>

    <section class="dashboard-grid">
      <div class="panel wide">
        <div class="panel-head">
          <h2>近几周趋势</h2>
        </div>
        <div id="trendChart" class="trend-chart"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>方向概览</h2>
        </div>
        <div id="directionCards" class="direction-cards"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>方法族分布</h2>
        </div>
        <div id="themeCloud" class="chip-cloud"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>A 会标签</h2>
        </div>
        <ul id="venueList" class="compact-list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>失败模式</h2>
        </div>
        <ul id="failureModesList" class="compact-list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>评测信号</h2>
        </div>
        <ul id="evaluationSignalsList" class="compact-list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Idea Hook</h2>
        </div>
        <ul id="ideaHooksList" class="compact-list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>有代码论文</h2>
        </div>
        <ul id="codeList" class="compact-list"></ul>
      </div>
    </section>

    <section class="paper-section">
      <div class="paper-tools">
        <div>
          <h2>论文浏览</h2>
          <p id="paperCount">0 papers</p>
        </div>
        <input id="searchInput" type="search" placeholder="搜索 title / method / failure / idea / family">
      </div>
      <div id="papers" class="papers"></div>
    </section>
  </main>

  <div id="paperModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="论文详情">
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
