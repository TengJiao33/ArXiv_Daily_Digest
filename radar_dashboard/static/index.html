<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Reliability Radar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232f8a68'/%3E%3Cpath d='M18 41V20h8c7 0 11 4 11 10.5S33 41 26 41h-8zm7-6h1c3 0 5-1.6 5-4.5S29 26 26 26h-1v9zm16 6V20h6v21h-6z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Agent Reliability Radar</h1>
      <p id="subtitle">Loading agent harness / reliability signals...</p>
    </div>
    <div class="toolbar">
      <button id="refreshBtn" class="icon-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <main>
    <section class="overview">
      <article class="metric">
        <span>去重论文</span>
        <strong id="totalPapers">0</strong>
      </article>
      <article class="metric">
        <span>带代码</span>
        <strong id="totalCode">0</strong>
      </article>
      <article class="metric">
        <span>A 会论文</span>
        <strong id="authorityCount">0</strong>
      </article>
    </section>

    <section class="dashboard-grid">
      <div class="panel wide">
        <div class="panel-head">
          <h2>近几周趋势</h2>
        </div>
        <div id="trendChart" class="trend-chart"></div>
      </div>

      <div class="dashboard-columns">
        <div class="dashboard-column">
          <div class="panel directions-panel">
            <div class="panel-head">
              <h2>方向概览</h2>
            </div>
            <div id="directionCards" class="direction-cards"></div>
          </div>
        </div>

        <div class="dashboard-column">
          <div class="panel code-panel">
            <div class="panel-head">
              <h2>代码资源</h2>
            </div>
            <ul id="codeList" class="compact-list"></ul>
          </div>

          <div class="panel cross-panel">
            <div class="panel-head">
              <h2>交叉标签</h2>
            </div>
            <ul id="crossDirectionList" class="compact-list"></ul>
          </div>

          <div class="panel venues-panel">
            <div class="panel-head">
              <h2>A 会标签</h2>
            </div>
            <ul id="venueList" class="compact-list"></ul>
          </div>

          <div class="panel hooks-panel">
            <div class="panel-head">
              <h2>选题钩子</h2>
            </div>
            <ul id="ideaHooksList" class="compact-list"></ul>
          </div>
        </div>
      </div>
    </section>

    <section id="papers-section" class="paper-section">
      <div class="paper-tools">
        <div class="paper-heading">
          <h2 id="paperSectionTitle">总览</h2>
          <p id="paperCount">0 papers</p>
          <div class="view-toggle" role="group" aria-label="论文视图">
            <button type="button" data-view="queue">阅读队列</button>
            <button class="active" type="button" data-view="overview">总览</button>
          </div>
        </div>
        <div class="paper-filters" aria-label="论文筛选">
          <select id="weekSelect" aria-label="week"></select>
          <select id="directionSelect" aria-label="direction"></select>
          <input id="searchInput" type="search" placeholder="搜索标题 / 摘要 / 交叉标签 / 风险 / 看点">
          <select id="yearFilter" aria-label="年份筛选">
            <option value="all">全部年份</option>
          </select>
          <select id="priorityFilter" aria-label="阅读优先级">
            <option value="all">全部优先级</option>
            <option value="high">高优先</option>
            <option value="medium">中优先</option>
            <option value="low">低优先</option>
          </select>
          <select id="codeFilter" aria-label="代码筛选">
            <option value="all">全部代码状态</option>
            <option value="with-code">有代码</option>
            <option value="without-code">无代码</option>
          </select>
          <select id="authorityFilter" aria-label="A会筛选">
            <option value="all">全部会议信号</option>
            <option value="authority">A会论文</option>
            <option value="non-authority">非A会</option>
          </select>
        </div>
      </div>
      <div id="papers" class="papers"></div>
      <div class="show-more-wrap">
        <button id="showMoreBtn" class="show-more hidden" type="button">显示更多</button>
      </div>
    </section>
  </main>

  <div id="paperModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="论文详情">
    <div class="modal-card">
      <button id="modalClose" class="modal-close" type="button" aria-label="Close">×</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
