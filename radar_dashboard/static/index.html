<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Radar Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Research Radar</h1>
      <p id="subtitle">Loading local research signals...</p>
    </div>
    <div class="toolbar">
      <select id="weekSelect" aria-label="week"></select>
      <select id="directionSelect" aria-label="direction"></select>
      <button id="refreshBtn" type="button" title="Refresh">↻</button>
    </div>
  </header>

  <main>
    <section class="overview">
      <article class="metric">
        <span>本周论文</span>
        <strong id="totalPapers">0</strong>
      </article>
      <article class="metric">
        <span>带代码</span>
        <strong id="totalCode">0</strong>
      </article>
      <article class="metric">
        <span>追踪方向</span>
        <strong id="directionCount">0</strong>
      </article>
      <article class="metric">
        <span>当前周</span>
        <strong id="currentWeek">-</strong>
      </article>
    </section>

    <section class="dashboard-grid">
      <div class="panel wide">
        <div class="panel-head">
          <h2>近几周趋势</h2>
        </div>
        <div id="trendChart" class="trend-chart"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>方向概览</h2>
        </div>
        <div id="directionCards" class="direction-cards"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Theme 分布</h2>
        </div>
        <div id="themeCloud" class="chip-cloud"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Limitations</h2>
        </div>
        <ul id="limitationsList" class="compact-list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>有代码论文</h2>
        </div>
        <ul id="codeList" class="compact-list"></ul>
      </div>
    </section>

    <section class="paper-section">
      <div class="paper-tools">
        <div>
          <h2>论文浏览</h2>
          <p id="paperCount">0 papers</p>
        </div>
        <input id="searchInput" type="search" placeholder="搜索 title / method / limitation / theme">
      </div>
      <div id="papers" class="papers"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
