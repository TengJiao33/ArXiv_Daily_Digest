      reason: "Manual ICLR 2026 backfill: agentic planning and tool-use benchmark without an arXiv ID found during curation."
      tags: ["ICLR 2026", "agent benchmark", "tool use", "workflow planning"]
      summary: "Recent progress in Large Language Models (LLMs) has transformed them from text generators into agentic systems capable of multi-step reasoning, structured planning, and tool use. However, existing benchmarks inadequately capture their ability to orchestrate complex workflows across multiple domains under realistic constraints. To address this, we propose OrchestrationBench, a bilingual (English/Korean) benchmark that systematically evaluates workflow-based planning and constraint-aware tool execution. OrchestrationBench spans 17 representative domains with nearly 100 realistic virtual tools, covering scenarios that require sequential and parallel planning, inter-tool dependencies, and constraint satisfaction across realistic agentic workflows."
