# ArXiv_Daily_Digest — Knowledge Editing Radar 研究方向配置
# 2026-05-31 起，系统从泛化探索转为围绕 knowledge editing / unlearning / reliability 的定向雷达。
# 每个方向定义：ArXiv 搜索查询、关键词、相关性过滤词、种子论文。

directions:
  knowledge-editing-core:
    name: "知识编辑核心方法"
    description: "ROME、MEMIT、MEND、SERAC、KN 等参数/记忆层面的知识编辑方法与后续改进。"
    arxiv_query: '((abs:"knowledge editing" OR abs:"model editing" OR abs:"factual editing" OR abs:"editing large language models" OR abs:"rank-one model editing" OR abs:ROME OR abs:MEMIT OR abs:MEND OR abs:SERAC OR abs:"knowledge neurons") AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG))'
    keywords:
      - knowledge editing
      - model editing
      - factual editing
      - ROME
      - MEMIT
      - MEND
      - SERAC
      - knowledge neurons
      - locate-then-edit
      - LocFT
      - AlphaEdit
      - SUIT
      - ACE
      - EAMET
      - factual association
      - counterfact
    relevance:
      must_any:
        - language model
        - large language model
        - llm
        - transformer
        - pretrained model
      topic_any:
        - knowledge editing
        - model editing
        - factual editing
        - rank-one model editing
        - mass-editing
        - memory editing
        - knowledge neuron
        - factual association
        - counterfact
    max_papers: 30
    seed_papers:
      - "2104.08696"   # Knowledge Neurons
      - "2110.11309"   # MEND
      - "2202.05262"   # ROME
      - "2206.06520"   # SERAC
      - "2210.07229"   # MEMIT
      - "2305.13172"   # Editing LLMs: Problems, Methods, and Opportunities
      - "2401.01286"   # A Comprehensive Study of Knowledge Editing for LLMs
      - "2410.02355"   # AlphaEdit
      - "2509.22072"   # LocFT-BF / Fine-tuning Done Right in Model Editing
      - "2510.07896"   # ACE: multi-hop factual recall editing
      - "2505.11876"   # EAMET: robust massive editing
      - "2509.24502"   # SUIT: subspace-aware KV mapping

  model-unlearning:
    name: "模型遗忘与反知识编辑"
    description: "LLM unlearning、选择性遗忘、隐私/安全知识移除、保留-遗忘权衡与可验证评测。"
    arxiv_query: '((abs:"machine unlearning" OR abs:"model unlearning" OR abs:"LLM unlearning" OR abs:"large language model unlearning" OR abs:"forget set" OR abs:"selective forgetting" OR abs:"right to be forgotten" OR abs:"hazardous knowledge" OR abs:"knowledge removal") AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG OR cat:cs.CR))'
    keywords:
      - machine unlearning
      - model unlearning
      - LLM unlearning
      - selective forgetting
      - forget set
      - retain set
      - privacy
      - hazardous knowledge
      - knowledge removal
      - TOFU
      - WMDP
      - RMU
      - PURGE
      - relearning attack
    relevance:
      must_any:
        - language model
        - large language model
        - llm
        - generative model
        - transformer
      topic_any:
        - unlearning
        - forgetting
        - forget set
        - retain set
        - knowledge removal
        - hazardous knowledge
        - right to be forgotten
        - privacy
    max_papers: 25
    seed_papers:
      - "2401.06121"   # TOFU
      - "2403.03218"   # WMDP
      - "2603.09980"   # Explainable LLM Unlearning
      - "2601.20568"   # PURGE / reinforcement unlearning
      - "2510.17620"   # Forget to Know, Remember to Use
      - "2505.16831"   # Unlearning Isn't Deletion

  editing-reliability-evaluation:
    name: "编辑可靠性与评测"
    description: "知识编辑后的 locality、generality、specificity、portability、robustness、side effect 与长期稳定性。"
    arxiv_query: '((abs:"knowledge editing" OR abs:"model editing" OR abs:"editing large language models" OR abs:"factual editing") AND (abs:reliability OR abs:robustness OR abs:locality OR abs:generality OR abs:specificity OR abs:portability OR abs:"side effect" OR abs:"sequential editing" OR abs:"lifelong editing" OR abs:benchmark) AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG))'
    keywords:
      - reliability
      - robustness
      - locality
      - generality
      - specificity
      - portability
      - side effect
      - interference
      - edit decay
      - sequential editing
      - lifelong normalization
      - lifelong editing
      - benchmark
      - evaluation
      - failure mode
    relevance:
      must_any:
        - knowledge editing
        - model editing
        - factual editing
        - edit
      topic_any:
        - reliability
        - robust
        - robustness
        - locality
        - generality
        - specificity
        - portability
        - side effect
        - sequential
        - lifelong
        - benchmark
        - evaluation
    max_papers: 30
    seed_papers:
      - "2305.13172"   # Editing LLMs: Problems, Methods, and Opportunities
      - "2401.01286"   # A Comprehensive Study of Knowledge Editing for LLMs
      - "2410.02355"   # AlphaEdit
      - "2509.22072"   # LocFT-BF / lifelong editing
      - "2505.11876"   # EAMET / robust massive editing
      - "2510.02392"   # KnowledgeSmith
      - "2510.01172"   # SPHERE
