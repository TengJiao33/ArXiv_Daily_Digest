      - "2602.10134"   # Reverse-Engineering Model Editing

  editing-frameworks-tooling:
    name: "编辑框架、工具与基准"
    description: "EasyEdit、EasyEdit2、知识编辑框架、benchmark、代码工具链与方法集成。"
    arxiv_query: '((abs:EasyEdit OR abs:"knowledge editing framework" OR abs:"model editing framework" OR abs:"editing framework" OR abs:"knowledge editing benchmark" OR abs:"model editing benchmark" OR abs:"editing toolkit" OR abs:"steering framework") AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG))'
    keywords:
      - EasyEdit
      - EasyEdit2
      - MoEEdit
      - AAEditor
      - framework
      - toolkit
      - benchmark
      - editing framework
      - steering framework
      - evaluation framework
      - method integration
      - reproducibility
    relevance:
      topic_any:
        - EasyEdit
        - framework
        - toolkit
        - benchmark
        - evaluation
        - knowledge editing
        - model editing
        - steering framework
        - method integration
        - reproducibility
    max_papers: 20
    seed_papers:
