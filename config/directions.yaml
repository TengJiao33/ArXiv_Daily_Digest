# ArXiv_Daily_Digest — Agent Reliability Radar 研究方向配置
# 2026-06-02 起，方向从狭义 knowledge editing 收缩为 2 条历史连续线，
# 并新增 4 条对齐吴小宝老师交流与公开研究口径的 agent / reliability 方向。
#
# 配置口径：
# - 保留旧目录 ID 的方向会继续读取历史 JSONL 数据；
# - 新方向会在后续采集时自动创建 data/{direction}/{ISO-week}/papers.jsonl；
# - 每个方向定义 ArXiv 查询、关键词、相关性过滤词和可选种子论文。

directions:
  editing-reliability-evaluation:
    name: "编辑可靠性与行为控制"
    description: "保留 knowledge editing 的连续性，但重点从改参数本体转向副作用、可靠评测、steering、机制解释与低风险行为控制。"
    arxiv_query: '(((abs:"knowledge editing" OR abs:"model editing" OR abs:"model steering" OR abs:"activation steering" OR abs:"representation steering" OR abs:"mechanistic interpretability" OR abs:"model control" OR abs:"intervention") AND (abs:reliability OR abs:robustness OR abs:locality OR abs:generality OR abs:specificity OR abs:"side effect" OR abs:"failure mode" OR abs:benchmark OR abs:evaluation)) AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG))'
    keywords:
      - knowledge editing reliability
      - model editing reliability
      - model steering
      - activation steering
      - representation steering
      - side effect
      - locality
      - generality
      - specificity
      - robustness
      - mechanistic interpretability
      - model control
      - intervention
      - evaluation
      - benchmark
    relevance:
      must_any:
        - language model
        - large language model
        - llm
        - foundation model
        - transformer
      topic_any:
        - knowledge editing
        - model editing
        - steering
        - intervention
        - model control
        - mechanistic interpretability
        - reliability
        - robustness
        - locality
        - specificity
        - side effect
        - failure mode
        - benchmark
        - evaluation
    max_papers: 30
    seed_papers:
      - "2402.18909"   # AKEW: Assessing Knowledge Editing in the Wild
      - "2401.17585"   # ReCoE / reasoning-based assessment
      - "2305.14795"   # MQUAKE
      - "2301.04213"   # Does Localization Inform Editing?
      - "2505.11876"   # EAMET / robust massive editing
      - "2602.10134"   # Reverse-Engineering Model Editing

  agent-skills-harness:
    name: "Agent Skills 与 Harness"
    description: "关注可执行 skill、agent harness、tool-use control、任务约束、资源条件和外部控制框架，强调低算力、可复现、可做 demo 的工业友好路线。"
    arxiv_query: '(((abs:"LLM agent" OR abs:"language model agent" OR abs:"AI agent" OR abs:"agentic") AND (abs:skill OR abs:skills OR abs:harness OR abs:"tool use" OR abs:tool-use OR abs:"skill library" OR abs:"executable skill" OR abs:"workflow" OR abs:"guardrail" OR abs:"task constraint")) AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG OR cat:cs.SE))'
    keywords:
      - LLM agent
      - agent skills
      - skill library
      - executable skill
      - harness
      - tool use
      - tool-use
      - workflow
      - guardrail
      - task constraint
      - external control
      - program function
      - repository grounded
      - execution-based evaluation
    relevance:
      must_any:
        - agent
        - agents
        - language model
        - large language model
        - llm
      topic_any:
        - skill
        - skills
        - harness
        - tool use
        - tool-use
        - tool calling
        - workflow
        - guardrail
        - executable
        - program
        - task constraint
        - environment
        - benchmark
    max_papers: 30
    seed_papers:
      - "2307.13854"   # WebArena / ICLR 2024
      - "2310.06770"   # SWE-bench / ICLR 2024
      - "2307.16789"   # ToolLLM / ICLR 2024
      - "2308.03688"   # AgentBench / ICLR 2024
      - "2311.12983"   # GAIA / ICLR 2024
