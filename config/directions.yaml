      - "2605.17734"   # HASP: Harnessing LLM Agents with Skill Programs
      - "2605.18693"   # SkillGenBench
      - "2405.16334"   # Devil's Advocate / anticipatory reflection
      - "2311.09721"   # Reasoning and Action in LLM Agents

  multi-agent-consistency:
    name: "多 Agent 交互与一致性"
    description: "关注多智能体协作、辩论、共识、同题多次运行不一致、早期失败检测、verifier 与仲裁机制。"
    arxiv_query: '(((abs:"multi-agent" OR abs:"multiple agents" OR abs:"LLM agents" OR abs:"language model agents" OR abs:"agent debate" OR abs:"multi-agent debate") AND (abs:consistency OR abs:disagreement OR abs:consensus OR abs:collaboration OR abs:coordination OR abs:judge OR abs:verification OR abs:stability)) AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG OR cat:cs.MA))'
