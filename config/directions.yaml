# Research Radar — 研究方向配置
# 每个方向定义：ArXiv 搜索查询、关键词、种子论文
# 你随时可以增删改方向，改完 push 即可生效

directions:
  llm-truthfulness:
    name: "LLM 真值性与事实性"
    description: "模型知道但不说、幻觉机制、真值干预、事实性检测、Know-Say Gap"
    # 限定 cs.CL + cs.LG，排除 cs.CV 视觉幻觉噪音
    # 搜索词聚焦：文本LLM的真值性/事实性/幻觉，以及探针/干预相关
    arxiv_query: '(abs:truthfulness OR abs:"factual recall" OR abs:factuality OR abs:"knowledge conflict" OR (abs:hallucination AND abs:"language model")) AND (cat:cs.CL OR cat:cs.LG)'
    keywords:
      - truthfulness
      - hallucination
      - factuality
      - factual recall
      - probing
      - ITI
      - contrastive decoding
      - CAD
      - know-say gap
      - knowledge conflict
    relevance:
      must_any:
        - language model
        - large language model
        - llm
        - transformer
      topic_any:
        - truthfulness
        - hallucination
        - factuality
        - factual
        - faithful
        - faithfulness
        - knowledge conflict
        - internal knowledge
        - parametric knowledge
        - know-say
        - source-supported
    max_papers: 25
    seed_papers:
      - "2310.06824"   # CAD - Shi et al. 2023
      - "2306.03341"   # RepE - Zou et al. 2023
      - "2306.01693"   # ITI - Li et al. 2023

  representation-engineering:
    name: "表示工程、激活引导与价值对齐干预"
    description: "通过操纵模型内部表示来控制行为；含 alignment / safety / persona / refusal / value steering"
    arxiv_query: '(abs:"representation engineering" OR abs:"activation steering" OR abs:"steering vector" OR abs:"linear probe" OR abs:"refusal direction" OR abs:"persona steering" OR abs:"value vector" OR abs:LEACE OR abs:"activation editing" OR abs:"inference-time alignment" OR abs:"contrastive activation") AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG)'
    keywords:
      - RepE
      - steering
      - activation
      - residual stream
      - intervention
      - CCS
      - LEACE
      - ConVA
      - value vector
      - refusal direction
      - persona steering
      - activation editing
      - inference-time alignment
      - safety steering
      - contrastive activation
      - concept erasure
    relevance:
      must_any:
        - language model
        - large language model
        - llm
        - transformer
      topic_any:
        - representation engineering
        - activation steering
        - steering vector
        - linear probe
        - residual stream
        - intervention
        - contrastive activation
        - latent representation
        - refusal
        - persona
        - value alignment
        - value vector
        - safety steering
        - concept erasure
        - activation editing
    max_papers: 30
    seed_papers:
      - "2306.03341"   # RepE - Zou et al. 2023
      - "2306.01693"   # ITI - Li et al. NeurIPS 2023
      - "2507.11316"   # ConVA - Jin, Huang et al. ACL 2025
      - "2401.16332"   # Tradeoffs Between Alignment and Helpfulness - ICML 2024 Spotlight

  mechanistic-interpretability:
    name: "机械可解释性"
    description: "理解 Transformer 内部计算机制"
    arxiv_query: '(abs:"mechanistic interpretability" OR abs:"circuit analysis" OR abs:"logit lens" OR abs:"sparse autoencoder") AND (cat:cs.CL OR cat:cs.AI OR cat:cs.LG)'
    keywords:
      - mechanistic
      - circuit
      - logit lens
      - superposition
      - SAE
      - sparse autoencoder
      - feature
    relevance:
      topic_any:
        - mechanistic interpretability
        - circuit analysis
        - logit lens
        - sparse autoencoder
        - transformer circuit
        - superposition
        - attention head
        - residual stream
    max_papers: 20
    seed_papers: []
